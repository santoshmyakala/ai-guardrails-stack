# Each control: what implements it, the tests that prove it, and the frameworks it supports.
# `scripts/compliance.py --check` fails if any listed test no longer exists, or if
# docs/compliance.md is out of date. The mapping supports an assessment; it is not a certification.
- id: IN-1
  layer: Input
  control: Prompt injection detection
  implementation: src/guardstack/input/injection.py
  evidence:
    - tests/test_input.py::test_direct_attacks_are_blocked
    - tests/test_input.py::test_obfuscated_attacks_are_blocked
    - tests/test_input.py::test_poisoned_documents_are_dropped_and_clean_ones_kept
    - tests/test_pipeline.py::test_injection_is_blocked_before_the_model_is_called
  owasp_llm: [LLM01]
  eu_ai_act: [Art. 15]
  nist_ai_rmf: [MANAGE]
- id: IN-2
  layer: Input
